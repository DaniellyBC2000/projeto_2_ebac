<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de contatos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <section id="agenda">
        <div class="container">
            <header>
                <img src="./images/agenda.webp" alt="Logo Agenda" />
                <h1>Agenda para os contatos</h1>
            </header>
            <form id="form-contatos">
                <input type="text" id="nomeCompleto" placeholder="Nome" required />
                <input type="tel" id="telefone" placeholder="(11) 99999-9999" required maxlength="15"/>
                <button type="submit">Adicionar</button>
            </form>

            <table cellspacing="0">
                <thead>
                    <tr>
                        <th>Nome: </th>
                        <th>Telefone: </th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
                <tfoot>
                    <tr>
                        <td>Total de contatos: </td>
                        <td id="total-contatos"><span class="contatos">-</span></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </section>
    <script src = "./main.js"></script>
</body>
</html>
